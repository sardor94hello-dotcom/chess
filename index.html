<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Telegram Shaxmat</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Chess & Socket.io Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  
  <!-- Chessboard UI -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #1c1816;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .status-card {
      background: #2b2623;
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    #board {
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      border-radius: 8px;
      overflow: hidden;
    }
    .info {
      margin-top: 15px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="status" class="status-card">Raqib kutilmoqda...</div>
    <div id="board"></div>
    <div class="info" id="color-info">Dona rangi: Aniqlanmoqda...</div>
  </div>

  <script>
    // 1. Telegram WebApp sozlamalari
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // 2. Render Backend Serveringiz havolasini qo'ying:
    const RENDER_SERVER_URL = "https://YOUR-RENDER-APP-NAME.onrender.com"; 

    const socket = io(RENDER_SERVER_URL);

    // URL parametridan xona ID (roomId) ni olish
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('roomId') || 'global_room';

    let board = null;
    let game = new Chess();
    let playerColor = 'w';

    function updateStatus() {
      let statusText = '';

      let moveColor = game.turn() === 'w' ? 'Oqlar' : 'Qoralar';

      if (game.in_checkmate()) {
        statusText = 'O\'yin tugadi! ' + moveColor + ' mot bo\'ldi.';
      } else if (game.in_draw()) {
        statusText = 'O\'yin tugadi! Durang.';
      } else {
        statusText = moveColor + 'ning yurishi';
        if (game.in_check()) {
          statusText += ' (Shox!)';
        }
      }

      document.getElementById('status').innerText = statusText;
    }

    function onDragStart(source, piece, position, orientation) {
      // O'yin tugagan bo'lsa yoki noto'g'ri navbat bo'lsa yurishga yo'l qo'ymaslik
      if (game.game_over()) return false;

      if ((playerColor === 'w' && piece.search(/^b/) !== -1) ||
          (playerColor === 'b' && piece.search(/^w/) !== -1) ||
          (game.turn() !== playerColor)) {
        return false;
      }
    }

    function onDrop(source, target) {
      // Yurish harakatini tekshirish
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      // Noto'g'ri yurish bo'lsa donani joyiga qaytarish
      if (move === null) return 'snapback';

      updateStatus();

      // Yurishni Render serveriga yuborish
      socket.emit('move', { roomId, move });
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    // Taxtani yaratish
    board = Chessboard('board', {
      draggable: true,
      position: 'start',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd
    });

    // Serverga ulanish
    socket.emit('joinGame', { roomId });

    socket.on('initGame', ({ color }) => {
      playerColor = color;
      if (color === 'b') {
        board.orientation('black');
        document.getElementById('color-info').innerText = 'Siz: Qora donalarsiz ♟';
      } else {
        board.orientation('white');
        document.getElementById('color-info').innerText = 'Siz: Oq donalarsiz ♙';
      }
    });

    socket.on('gameStart', () => {
      updateStatus();
    });

    socket.on('move', (move) => {
      game.move(move);
      board.position(game.fen());
      updateStatus();
    });
  </script>
</body>
</html>
